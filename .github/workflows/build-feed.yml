name: Build live calendar feed

on:
  schedule:
    - cron: '*/15 * * * *'      # every 15 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch:             # "Run workflow" button for an immediate refresh
  repository_dispatch:
    types: [calendar-updated]    # optional external trigger
  push:
    branches: [main]
    paths: ['build-feed.mjs', '.github/workflows/build-feed.yml']

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build feed from Firebase
        env:
          FIREBASE_REFRESH_TOKEN: ${{ secrets.FIREBASE_REFRESH_TOKEN }}
          # Internal / Both feeds go to a secret Gist (never this public repo)
          FEED_GIST_TOKEN: ${{ secrets.FEED_GIST_TOKEN }}
          FEED_GIST_ID:    ${{ secrets.FEED_GIST_ID }}
          FEED_PRIVATE_EXCLUDE_TYPES: ${{ vars.FEED_PRIVATE_EXCLUDE_TYPES }}
          # Optional overrides (Settings → Secrets and variables → Actions → Variables)
          FEED_STATUSES:      ${{ vars.FEED_STATUSES }}
          FEED_EXCLUDE_TYPES: ${{ vars.FEED_EXCLUDE_TYPES }}
          FEED_EXCLUDE_ROOMS: ${{ vars.FEED_EXCLUDE_ROOMS }}
          FEED_PAST_DAYS:     ${{ vars.FEED_PAST_DAYS }}
          FEED_FUTURE_DAYS:   ${{ vars.FEED_FUTURE_DAYS }}
          FEED_INCLUDE_UNSET: ${{ vars.FEED_INCLUDE_UNSET }}
        run: node build-feed.mjs

      - name: Commit feed if changed
        # Still commit the public feed if only the private (gist) step failed
        if: success() || failure()
        run: |
          if git diff --quiet --exit-code -- feed/ && [ -z "$(git ls-files --others --exclude-standard feed/)" ]; then
            echo "Feed unchanged."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/
          git commit -m "Update live calendar feed [skip ci]"
          git pull --rebase --autostash
          git push
